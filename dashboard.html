<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="./assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
  <link rel="manifest" href="./assets/site.webmanifest" />
  <meta name="theme-color" content="#030914" />
  <title>Home | TN-170</title>
  <link rel="stylesheet" href="./css/portal-v2.css?v=6" />
  <link rel="stylesheet" href="./css/portal-ops.css?v=1" />
  <link rel="stylesheet" href="./portal-nav.css?v=7" />
  <link rel="stylesheet" href="./css/portal-layout.css?v=2" />
  <link rel="stylesheet" href="./css/steward-workspace.css?v=4" />
</head>
<body class="page-home" data-portal-page="home">
  <div class="portal-app" id="portalApp" hidden>
    <button type="button" class="portal-menu-toggle" id="portalMenuToggle" aria-label="Open menu">☰</button>
    <div class="portal-backdrop" id="portalBackdrop"></div>
    <aside class="portal-sidebar" id="portalSidebar">
      <button type="button" class="portal-menu-close" id="portalMenuClose" aria-label="Close menu">✕</button>
      <div class="portal-brand">
        <img src="./assets/BDB98475-52E2-4DC4-A6F0-43B6A3CED3EE.png" alt="TN-170" />
        <strong>TN-170</strong>
        <span>Oak Ridge Composite</span>
      </div>
      <nav id="portalNav"></nav>
    </aside>
    <div class="portal-main">
      <div class="portal-content portal-content--wide portal-content--workspace">
        <div id="dashboardV2"></div>
      </div>
      <div data-portal-footer></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/auth-guard.js?v=7"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      const ok = await window.TN170AuthGuard.runDashboardPage();
      if (ok) {
        window.TN170AuthGuard.loadPortalScripts("dashboard");
      }
    });
  </script>
</body>
</html>
