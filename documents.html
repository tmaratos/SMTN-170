<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="./assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
  <link rel="manifest" href="./assets/site.webmanifest" />
  <meta name="theme-color" content="#030914" />
  <title>Files &amp; Forms | TN-170</title>
  <link rel="stylesheet" href="./css/portal-v2.css?v=4" />
  <link rel="stylesheet" href="./portal-nav.css?v=5" />
  <link rel="stylesheet" href="./document-intake.css?v=1" />
</head>
<body data-portal-page="files">
  <div class="portal-app">
    <button type="button" class="portal-menu-toggle" id="portalMenuToggle" aria-label="Open menu">☰</button>
    <div class="portal-backdrop" id="portalBackdrop"></div>
    <aside class="portal-sidebar" id="portalSidebar">
      <button type="button" class="portal-menu-close" id="portalMenuClose" aria-label="Close menu">✕</button>
      <div class="portal-brand">
        <img src="./assets/BDB98475-52E2-4DC4-A6F0-43B6A3CED3EE.png" alt="TN-170" />
        <strong>TN-170</strong>
        <span>Oak Ridge Composite</span>
      </div>
      <nav id="portalNav"></nav>
    </aside>
    <div class="portal-main">
      <header class="portal-topbar">
        <div>
          <h1>Files &amp; Forms</h1>
          <p>Upload · organize · review squadron documents</p>
        </div>
      </header>
      <div class="portal-content portal-content--wide">
        <div class="page-frame page-stack">
          <p class="page-intro">Upload squadron files, sort them into folders, and review items that need staff attention. Steward will suggest categories when connected.</p>
          <div data-steward-context="files"></div>
          <div id="diStatusBar" aria-live="polite"></div>
          <div class="card-grid-3" id="fileCategoryCards"></div>
          <section class="di-layout">
            <div class="workspace-panel card-action" style="padding:0;border:0;background:transparent">
              <div id="diMainPanel" aria-live="polite"></div>
            </div>
            <aside class="di-sidebar-stack" id="diSidePanel" aria-live="polite"></aside>
          </section>
        </div>
      </div>
      <div data-portal-footer></div>
    </div>
  </div>
  <script src="./portal-config.js?v=2"></script>
  <script src="./js/portal-data.js?v=2"></script>
  <script src="./portal-nav.js?v=5"></script>
  <script src="./js/portal-shell.js?v=4"></script>
  <script src="./document-intake.js?v=1"></script>
  <script src="./js/steward.js?v=3"></script>
  <script>
    (function () {
      const cats = window.SMTN170_DATA?.FILE_CATEGORIES || [];
      const el = document.getElementById("fileCategoryCards");
      if (el) {
        el.innerHTML = cats
          .map(
            (c) =>
              `<article class="card-info" style="padding:16px 18px"><h3 style="margin:0 0 8px;font-size:1rem">${c}</h3><button type="button" class="ghost-btn" disabled>Reclassify</button></article>`
          )
          .join("");
      }
    })();
  </script>
</body>
</html>
