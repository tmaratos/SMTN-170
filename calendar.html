<body data-portal-page="calendar">
  <div class="portal-app">
    <button type="button" class="portal-menu-toggle" id="portalMenuToggle" aria-label="Open menu">☰</button>
    <div class="portal-backdrop" id="portalBackdrop"></div>
    <aside class="portal-sidebar" id="portalSidebar">
      <button type="button" class="portal-menu-close" id="portalMenuClose" aria-label="Close menu">✕</button>
      <div class="portal-brand">
        <img src="./assets/BDB98475-52E2-4DC4-A6F0-43B6A3CED3EE.png" alt="TN-170" />
        <strong>TN-170</strong>
        <span>Oak Ridge Composite</span>
      </div>
      <nav id="portalNav"></nav>
    </aside>
    <div class="portal-main">
      <header class="portal-topbar">
        <div>
          <h1>Calendar</h1>
          <p>Private Senior Member operations workspace for TN-170</p>
        </div>
        <a class="btn-gold" href="schedule.html" data-steward-action="navigate" data-steward-label="Meeting planner" data-steward-target="schedule.html" data-steward-help="Build the monthly squadron meeting schedule">Meeting planner</a>
      </header>
      <div class="portal-content portal-content--wide">
        <div class="page-frame">
          <p class="page-intro">Post squadron events and see what is coming up. Flight review nights show a BFR badge.</p>
          <div data-steward-context="calendar"></div>
          <section class="calendar-grid workspace-split">
            <article class="workspace-panel card-info">
              <h2 style="margin:0 0 16px;font-size:1.15rem">Add an event</h2>
              <form class="form-panel" id="calendarAddForm">
                <label>Event title</label>
                <input name="title" placeholder="Weekly squadron meeting" required />
                <label>Date</label>
                <input type="date" name="date" required />
                <label>Start time</label>
                <input type="time" name="startTime" />
                <label>End time</label>
                <input type="time" name="endTime" />
                <label>Location</label>
                <input name="location" placeholder="Squadron classroom" />
                <button type="submit" class="btn-gold" data-steward-action="submit" data-steward-label="Add to calendar" data-steward-help="Post a new event on the squadron calendar">Add to calendar</button>
              </form>
            </article>
            <article class="workspace-panel card-action">
              <h2 style="margin:0 0 16px;font-size:1.15rem">Upcoming events</h2>
              <div class="event-list large" id="calendarEventList" aria-live="polite"></div>
            </article>
          </section>
        </div>
      </div>
      <div data-portal-footer></div>
    </div>
