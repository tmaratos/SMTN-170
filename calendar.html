<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Squadron Calendar | Oak Ridge Composite Squadron</title>
  <link rel="stylesheet" href="./styles.css?v=8" />
  <link rel="stylesheet" href="./flight-review.css?v=1" />
  <link rel="stylesheet" href="./portal-nav.css?v=1" />
</head>
<body data-portal-page="schedule">
  <div class="shell">
    <aside class="sidebar">
      <img src="assets/BDB98475-52E2-4DC4-A6F0-43B6A3CED3EE.png" class="side-logo" alt="Logo" />
      <nav data-portal-nav="shell"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>Squadron Calendar</h1>
          <p>Meeting nights · BFR sessions · training · special activities</p>
        </div>
      </header>

      <section class="calendar-grid">
        <article class="panel">
          <h2>Post squadron event</h2>
          <form class="form-panel" id="calendarAddForm">
            <label>Event Title</label>
            <input name="title" placeholder="Weekly Squadron Meeting" required />
            <label>Date</label>
            <input type="date" name="date" required />
            <label>Start Time</label>
            <input type="time" name="startTime" />
            <label>End Time</label>
            <input type="time" name="endTime" />
            <label>Location</label>
            <input name="location" placeholder="Squadron Classroom" />
            <button type="submit">Add Event</button>
          </form>
          <p class="small-note" style="margin-top:14px">Directorate BFR nights from <a href="flight-review.html" style="color:var(--cyan);font-weight:800">Biannual Flight Reviews</a> show with a <span class="fr-event-badge">BFR</span> badge.</p>
        </article>

        <article class="panel">
          <h2>May 2026 Events</h2>
          <div class="event-list large" id="calendarEventList" aria-live="polite"></div>
        </article>
      </section>
    </main>
  </div>
  <script src="./portal-nav.js?v=1"></script>
  <script src="./flight-review.js?v=1"></script>
</body>
</html>
