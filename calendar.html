<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="./assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
  <link rel="manifest" href="./assets/site.webmanifest" />
  <meta name="theme-color" content="#030914" />
  <title>Calendar | TN-170</title>
  <script type="application/json" id="steward-page-meta">
  {"pageId":"calendar","title":"Calendar","path":"calendar.html","section":"Main","summary":"Read-only month view of every approved squadron event. Edit events in Tasks or the Monthly Meeting Schedule Builder.","primaryActions":["View this month","Jump to today","Filter event categories"],"forms":[],"buttons":["Previous month","Next month","Today","Meeting planner"],"relatedPages":["schedule.html","tasks.html","flight-review.html"],"keywords":["calendar","events","meetings","schedule","month","grid"]}
  </script>
  <link rel="stylesheet" href="./css/portal-v2.css?v=6" />
  <link rel="stylesheet" href="./css/portal-ops.css?v=1" />
  <link rel="stylesheet" href="./portal-nav.css?v=6" />
  <link rel="stylesheet" href="./css/portal-layout.css?v=2" />
  <link rel="stylesheet" href="./css/portal-calendar.css?v=1" />
</head>
<body data-portal-page="calendar">
  <div class="portal-app">
    <button type="button" class="portal-menu-toggle" id="portalMenuToggle" aria-label="Open menu">☰</button>
    <div class="portal-backdrop" id="portalBackdrop"></div>
    <aside class="portal-sidebar" id="portalSidebar">
      <button type="button" class="portal-menu-close" id="portalMenuClose" aria-label="Close menu">✕</button>
      <div class="portal-brand">
        <img src="./assets/BDB98475-52E2-4DC4-A6F0-43B6A3CED3EE.png" alt="TN-170" />
        <strong>TN-170</strong>
        <span>Oak Ridge Composite</span>
      </div>
      <nav id="portalNav"></nav>
    </aside>
    <div class="portal-main">
      <header class="portal-topbar">
        <div>
          <h1>Calendar</h1>
          <p>Private Senior Member operations workspace for TN-170</p>
        </div>
        <a class="btn-gold" href="schedule.html" data-steward-action="navigate" data-steward-label="Meeting planner" data-steward-target="schedule.html" data-steward-help="Build the monthly squadron meeting schedule">Meeting planner</a>
      </header>
      <div class="portal-content portal-content--wide">
        <div class="page-frame">
          <div data-steward-context="calendar"></div>

          <aside class="cal-banner" role="note">
            <span class="cal-banner-icon" aria-hidden="true">📅</span>
            <div>
              <strong>Squadron calendar — read only.</strong>
              <span>Add or edit individual events in <a href="tasks.html">Tasks</a> or the <a href="schedule.html">Monthly Meeting Schedule Builder</a>.</span>
            </div>
          </aside>

          <section class="cal-shell" aria-label="Month calendar">
            <header class="cal-toolbar">
              <div class="cal-toolbar-title">
                <h2 id="calMonthTitle" aria-live="polite">Loading…</h2>
              </div>
              <div class="cal-toolbar-controls">
                <button type="button" class="cal-btn cal-btn--today" id="calTodayBtn" aria-label="Jump to today">Today</button>
                <div class="cal-nav-group" role="group" aria-label="Month navigation">
                  <button type="button" class="cal-btn cal-btn--nav" id="calPrevBtn" aria-label="Previous month">◀</button>
                  <button type="button" class="cal-btn cal-btn--nav" id="calNextBtn" aria-label="Next month">▶</button>
                </div>
              </div>
            </header>

            <div class="cal-filters" id="calFilters" role="group" aria-label="Filter by event category"></div>

            <div class="cal-grid-wrap">
              <div class="cal-weekhead" aria-hidden="true">
                <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
              </div>
              <div class="cal-grid" id="calGrid" role="grid" aria-labelledby="calMonthTitle">
                <p class="cal-empty">Loading squadron calendar…</p>
              </div>
            </div>
          </section>
        </div>
      </div>
      <div data-portal-footer></div>
    </div>
  </div>

  <div class="cal-modal" id="calEventModal" role="dialog" aria-modal="true" aria-labelledby="calModalTitle" hidden>
    <div class="cal-modal-backdrop" data-close-modal></div>
    <div class="cal-modal-panel" role="document">
      <button type="button" class="cal-modal-close" data-close-modal aria-label="Close">✕</button>
      <p class="cal-modal-kicker" id="calModalKicker"></p>
      <h3 class="cal-modal-title" id="calModalTitle"></h3>
      <dl class="cal-modal-meta" id="calModalMeta"></dl>
      <p class="cal-modal-notes" id="calModalNotes"></p>
    </div>
  </div>

  <script src="./js/portal-scripts.js?v=14" data-page="calendar"></script>
</body>
</html>
