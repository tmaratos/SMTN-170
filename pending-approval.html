<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="./assets/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="./css/portal-v2.css?v=6" />
  <link rel="stylesheet" href="./css/portal-ops.css?v=1" />
  <title>Awaiting approval | TN-170</title>
</head>
<body class="login-v2">
  <main class="login-card-v2" style="max-width:520px;text-align:left">
    <img src="./assets/BDB98475-52E2-4DC4-A6F0-43B6A3CED3EE.png" alt="TN-170" class="login-patch" style="margin-bottom:16px" />
    <p class="login-motto">Not Without Effort.</p>
    <h1 style="text-align:left">Awaiting approval</h1>
    <p class="login-unit" style="text-align:left">Your account is awaiting approval by squadron leadership.</p>
    <p id="pendingIdentity" class="login-unit" style="margin-top:16px;font-weight:700;color:var(--tn-gold)"></p>
    <p id="pendingEmail" class="login-unit"></p>
    <p class="login-unit"><strong>Status:</strong> Pending approval</p>
    <button type="button" class="btn-gold btn-lg" style="width:100%;margin-top:20px" onclick="logout()">Log out</button>
    <p class="portal-fbi" style="margin-top:24px;text-align:center">Steward for CAP · Built by Faith Based Innovations</p>
  </main>
  <script src="./js/firebase-config.js?v=1"></script>
  <script src="./js/firebase-client.js?v=1"></script>
  <script src="./js/firebase-data.js?v=2"></script>
  <script src="./js/profile-service.js?v=1"></script>
  <script src="./js/auth.js?v=11"></script>
  <script>
    async function logout() {
      const client = window.SMTN170Firebase?.getClient?.();
      if (client) await client.auth.signOut();
      location.href = "login.html";
    }

    (async function () {
      await window.SMTN170Firebase?.whenReady?.();
      await window.SMTN170Auth?.init?.();
      const s = window.SMTN170Auth?.loadSession?.();
      if (!s) {
        location.href = "login.html";
        return;
      }
      if (window.SMTN170Auth?.isApproved?.(s)) {
        location.href = "dashboard.html";
        return;
      }
      if (window.SMTN170Auth?.isDenied?.(s)) {
        location.href = "access-denied.html";
        return;
      }
      const profile = window.SMTN170Auth?.getProfile?.() || s;
      const name = window.SMTN170Profile?.computeDisplayName?.(profile);
      const nameEl = document.getElementById("pendingIdentity");
      const emailEl = document.getElementById("pendingEmail");
      if (nameEl) nameEl.textContent = name || "Signed in";
      if (emailEl) emailEl.textContent = s.email ? `Email: ${s.email}` : "";
    })();
  </script>
</body>
</html>
