<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oak Ridge Composite Squadron | Senior Member Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <main class="login-wrap">
    <section class="login-card">
      <img src="assets/BDB98475-52E2-4DC4-A6F0-43B6A3CED3EE.png" alt="Oak Ridge Composite Squadron logo" class="login-logo" />

      <p class="kicker">Oak Ridge Composite Squadron</p>
      <h1>Senior Member Operations Portal</h1>
      <p class="login-copy">
        Build monthly schedules, manage squadron documents, organize resources,
        and export calendar-ready operations plans.
      </p>

      <form onsubmit="portalLogin(event)" class="login-form">
        <label>Email</label>
        <input type="email" placeholder="senior.member@example.com" />

        <label>Access Code</label>
        <input type="password" placeholder="Portal access code" />

        <button type="submit">Enter Portal</button>
      </form>

      <p class="small-note">Prototype login. Supabase authentication can be added later.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
