<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0;url=login.html" />
  <title>TN-170 Senior Member Portal</title>
  <script src="./js/supabase-config.js?v=1"></script>
  <script src="./js/supabase-client.js?v=1"></script>
  <script src="./js/portal-auth.js?v=2"></script>
  <script>
    (async function () {
      await window.SMTN170Supabase?.whenReady?.();
      await window.SMTN170Auth?.init?.();
      if (window.SMTN170Auth?.isAuthenticated?.()) {
        const s = window.SMTN170Auth.loadSession();
        location.replace(
          s?.accountStatus === "awaiting_verification" ? "pending-approval.html" : "dashboard.html"
        );
      } else {
        location.replace("login.html");
      }
    })();
  </script>
</head>
<body><p><a href="login.html">TN-170 Senior Member portal — sign in</a></p></body>
</html>
