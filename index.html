<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  
  <link rel="icon" href="./assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
  <link rel="manifest" href="./assets/site.webmanifest" />
  <meta name="theme-color" content="#030914" />

  <!-- Prevent aggressive mobile/GitHub Pages caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Oak Ridge Composite Squadron</title>

  <!-- IMPORTANT -->
  <link rel="stylesheet" href="./styles.css?v=8" />
  <link rel="stylesheet" href="./desktop.css?v=8" media="(min-width: 901px)" />
  <link rel="stylesheet" href="./mobile.css?v=8" media="(max-width: 900px)" />
</head>
<body class="login-page">
  <main class="login-wrap">
    <section class="login-card">
      <img src="assets/BDB98475-52E2-4DC4-A6F0-43B6A3CED3EE.png" alt="Oak Ridge Composite Squadron logo" class="login-logo" />

      <p class="kicker">Oak Ridge Composite Squadron</p>
      <h1>Squadron Operations Desk</h1>
      <p class="login-copy">
        Monthly schedule, biannual flight reviews, SUI prep, operations and safety files,
        training records, and the squadron file library — built for CAP senior members and officers.
      </p>

      <form onsubmit="portalLogin(event)" class="login-form">
        <label>Email</label>
        <input type="email" placeholder="senior.member@example.com" />

        <label>Access Code</label>
        <input type="password" placeholder="Portal access code" />

        <button type="submit">Enter Portal</button>
      </form>

      <p class="small-note">Prototype login. Supabase authentication can be added later.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
