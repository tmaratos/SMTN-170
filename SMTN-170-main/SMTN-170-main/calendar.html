<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Calendar / Events | Oak Ridge Composite Squadron</title>
  <link rel="stylesheet" href="./styles.css?v=6" />
  <link rel="stylesheet" href="./flight-review.css?v=1" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <img src="assets/BDB98475-52E2-4DC4-A6F0-43B6A3CED3EE.png" class="side-logo" alt="Logo" />
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="schedule.html">Schedule Builder</a>
        <a class="active" href="calendar.html">Calendar / Events</a>
        <a href="flight-review.html">Flight Review Readiness</a>
        <a href="documents.html">Documents</a>
        <a href="resources.html">Resources</a>
        <a href="exports.html">Exports</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>Calendar / Events</h1>
          <p>Monthly squadron schedule · department biannual flight reviews</p>
        </div>
      </header>

      <section class="calendar-grid">
        <article class="panel">
          <h2>Add Event</h2>
          <form class="form-panel" id="calendarAddForm">
            <label>Event Title</label>
            <input name="title" placeholder="Weekly Squadron Meeting" required />
            <label>Date</label>
            <input type="date" name="date" required />
            <label>Start Time</label>
            <input type="time" name="startTime" />
            <label>End Time</label>
            <input type="time" name="endTime" />
            <label>Location</label>
            <input name="location" placeholder="Squadron Classroom" />
            <button type="submit">Add Event</button>
          </form>
          <p class="small-note" style="margin-top:14px">Department reviews scheduled in <a href="flight-review.html" style="color:var(--cyan);font-weight:800">Flight Review Readiness</a> appear here with a <span class="fr-event-badge">BFR</span> badge.</p>
        </article>

        <article class="panel">
          <h2>May 2026 Events</h2>
          <div class="event-list large" id="calendarEventList" aria-live="polite"></div>
        </article>
      </section>
    </main>
  </div>
  <script src="./flight-review.js?v=1"></script>
</body>
</html>
