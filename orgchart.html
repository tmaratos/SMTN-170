<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
  <link rel="manifest" href="./assets/site.webmanifest" />
  <meta name="theme-color" content="#030914" />

  </script>
  <link rel="stylesheet" href="./css/portal-v2.css?v=6" />
  <link rel="stylesheet" href="./css/portal-ops.css?v=1" />
  <link rel="stylesheet" href="./portal-nav.css?v=6" />
  <link rel="stylesheet" href="./css/portal-layout.css?v=2" />
</head>
<body data-portal-page="orgchart">
  <div class="portal-app">
    <button type="button" class="portal-menu-toggle" id="portalMenuToggle" aria-label="Open menu">☰</button>
    <div class="portal-backdrop" id="portalBackdrop"></div>
    <aside class="portal-sidebar" id="portalSidebar">
      <button type="button" class="portal-menu-close" id="portalMenuClose" aria-label="Close menu">✕</button>
      <div class="portal-brand">
        <img src="./assets/BDB98475-52E2-4DC4-A6F0-43B6A3CED3EE.png" alt="TN-170" />
        <strong>TN-170</strong>
        <span>Oak Ridge Composite</span>
      </div>
      <nav id="portalNav"></nav>
    </aside>
    <div class="portal-main">
      <header class="portal-topbar org-topbar-mobile">
        <div>
          <h1>Organization Chart</h1>
          <p>Private Senior Member operations workspace for TN-170</p>
        </div>
      </header>
      <div class="portal-content portal-content--wide">
        <div class="page-frame page-stack" id="orgChartApp" aria-live="polite">
          <p class="page-intro">Loading organization chart…</p>
        </div>
      </div>
      <div data-portal-footer></div>
    </div>
  </div>
  <div class="org-mobile-actions" id="orgMobileActions" role="toolbar" aria-label="Quick org chart actions">
    <button type="button" class="btn-gold" data-action="add-position" data-steward-action="create" data-steward-label="Add position" data-steward-help="Add a new billet to the org chart">Add</button>
    <button type="button" class="btn-outline" data-action="view-vacancies" data-steward-action="filter" data-steward-label="View vacancies" data-steward-help="Show vacant squadron positions">Vacancies</button>
    <button type="button" class="btn-outline" data-steward-ask="Help build the squadron org chart." data-steward-action="ask" data-steward-label="Steward" data-steward-help="Ask Steward about org chart structure">Steward</button>
  </div>
  <script src="./js/portal-scripts.js?v=12" data-page="orgchart"></script>
  <script>
    document.getElementById("orgMobileActions")?.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-action],[data-steward-ask]");
      if (!btn) return;
      if (btn.dataset.stewardAsk) {
        (window.openSteward || window.SMTN170Steward?.openSteward)?.(btn.dataset.stewardAsk);
        return;
      }
      document.getElementById("orgChartApp")?.querySelector('[data-action="' + btn.dataset.action + '"]')?.click();
    });
  </script>
</body>
</html>
