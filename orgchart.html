<body data-portal-page="orgchart">
  <div class="portal-app">
    <button type="button" class="portal-menu-toggle" id="portalMenuToggle" aria-label="Open menu">☰</button>
    <div class="portal-backdrop" id="portalBackdrop"></div>
    <aside class="portal-sidebar" id="portalSidebar">
      <button type="button" class="portal-menu-close" id="portalMenuClose" aria-label="Close menu">✕</button>
      <div class="portal-brand">
        <img src="./assets/BDB98475-52E2-4DC4-A6F0-43B6A3CED3EE.png" alt="TN-170" />
        <strong>TN-170</strong>
        <span>Oak Ridge Composite</span>
      </div>
      <nav id="portalNav"></nav>
    </aside>
    <div class="portal-main">
      <header class="portal-topbar org-topbar-mobile">
        <div>
          <h1>Organization Chart</h1>
          <p>Private Senior Member operations workspace for TN-170</p>
        </div>
      </header>
      <div class="portal-content portal-content--wide">
        <div class="page-frame page-stack" id="orgChartApp" aria-live="polite">
          <p class="page-intro">Loading organization chart…</p>
        </div>
      </div>
      <div data-portal-footer></div>
    </div>
  </div>
  <div class="org-mobile-actions" id="orgMobileActions" role="toolbar" aria-label="Quick org chart actions">
    <button type="button" class="btn-gold" data-ocb-cmd="save" data-steward-action="save" data-steward-label="Save Org Chart" data-steward-help="Save this org chart to the squadron workspace">Save</button>
    <button type="button" class="btn-outline" data-ocb-cmd="reset" data-steward-action="reset" data-steward-label="Reset to TN-170 default" data-steward-help="Pre-populate the standard TN-170 layout">Reset</button>
    <button type="button" class="btn-outline" data-ocb-cmd="preview" data-steward-action="preview" data-steward-label="Preview Print Layout" data-steward-help="Open the print preview">Preview</button>
    <button type="button" class="btn-outline" data-ocb-cmd="print" data-steward-action="print" data-steward-label="Print / Save as PDF" data-steward-help="Print or save as PDF">Print</button>
    <button type="button" class="btn-outline" data-steward-ask="Help me build the squadron Table of Organization." data-steward-action="ask" data-steward-label="Steward" data-steward-help="Ask Steward about org chart structure">Steward</button>
  </div>
  <script src="./js/portal-scripts.js?v=14" data-page="orgchart"></script>
  <script>
    document.getElementById("orgMobileActions")?.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-ocb-cmd],[data-steward-ask]");
      if (!btn) return;
      if (btn.dataset.stewardAsk) {
        (window.openSteward || window.SMTN170Steward?.openSteward)?.(btn.dataset.stewardAsk);
        return;
      }
      var cmd = btn.dataset.ocbCmd;
      if (!cmd) return;
      var target = document.getElementById("orgChartApp")?.querySelector('[data-ocb-cmd="' + cmd + '"]');
      if (target) target.click();
    });
  </script>
